document.getElementById('store').textContent=D.storeName+' — Product Journey & Repurchase Timing';

document.getElementById('footer').textContent='Generated from '+D.columnTotals[0].toLocaleString()+' first orders · '+D.dateRange+' · timing computed from order dates';
const cards=[
 {v:D.totalCustomers.toLocaleString(),l:'Total Customers'},
 {v:D.repeatRate+'%',l:'Repeat Rate',note:'buy a 2nd time'},
 {v:D.medDaysTo2nd+' days',l:'Median Time to 2nd Order',note:D.meanDaysTo2nd+' days average',hl:true,amber:true},
 {v:D.switchPct+'%',l:'Buy a Different Scent Next',note:'the discovery audience'},
 {v:D.sameScenePct+'%',l:'Rebuy the Same Scent',note:'the replenishment audience'}];

 `<div class="stat${c.hl?' hl':''}"><div class="v${c.amber?' amber':''}">${c.v}</div><div class="l">${c.l}</div>${c.note?`<div class="note">${c.note}</div>`:''}</div>`).join('');
document.getElementById('insight').innerHTML=
 `⏱ <b>Timing — the piece the earlier export was missing:</b> repeat customers take a <b>median ${D.medDaysTo2nd} days</b> (mean ${D.meanDaysTo2nd}) to place their 2nd order, and the gap tightens with loyalty — <b>${D.transMed[0]} → ${D.transMed[1]} → ${D.transMed[2]} days</b> across the 2nd, 3rd and 4th orders. `+
 `<b>What to do:</b> ${D.switchPct}% come back for a <b>different</b> fragrance, not a refill — so trigger a "discover your next scent" recommendation around <b>day 45–60</b> (before the median) to pull the next order forward. Only ${D.sameScenePct}% replenish the same scent — Seduction &amp; Imperial are the loyal exceptions, and Imperial reorders in ~12 days.`;
const svg=d3.select('#svg');
const nodes=D.nodes.map(n=>Object.assign({},n));
const links=D.links.map(l=>Object.assign({},l));
const sankey=d3.sankey().nodeId(d=>d.id).nodeWidth(20).nodePadding(16)

const g=sankey({nodes,links});
// weighted avg gap to next order, per node
g.nodes.forEach(n=>{const outs=g.links.filter(l=>l.source===n);const tot=d3.sum(outs,l=>l.value);
 n.nextGap=tot?Math.round(d3.sum(outs,l=>l.avgDays*l.value)/tot):null;});

 gr.append('stop').attr('offset','100%').attr('stop-color',colorOf(l.target));});
const cols=[...new Set(g.nodes.map(n=>n.col))].sort((a,b)=>a-b);
const colX={};cols.forEach(c=>{const ns=g.nodes.filter(n=>n.col===c);colX[c]=(ns[0].x0+ns[0].x1)/2;});
cols.forEach((c,i)=>{

  const midx=(colX[cols[i-1]]+colX[c])/2;

const linkSel=svg.append('g').attr('fill','none').selectAll('path').data(g.links).join('path')

const tt=document.getElementById('tt');
function move(e){const o=tt.getBoundingClientRect();let x=e.clientX+16,y=e.clientY-10;if(x+o.width>innerWidth)x=e.clientX-o.width-16;if(y+o.height>innerHeight)y=innerHeight-o.height-8;tt.style.left=x+'px';tt.style.top=Math.max(8,y)+'px';}
function hideAll(){linkSel.attr('stroke-opacity',.22);}
function dim(keep){linkSel.attr('stroke-opacity',l=>keep.has(l)?.55:.05);}
nodeG.on('mousemove',(e,d)=>{const conn=new Set(g.links.filter(l=>l.source===d||l.target===d));dim(conn);
 const cs=d.crossSells&&d.crossSells.length?`<div class="cap">Often in the same order</div>`+d.crossSells.map(c=>`<span class="chip">${c.name} ${c.pct}%</span>`).join(''):'';
 const gap=d.nextGap!=null?`<div class="r time">⏱ ~${d.nextGap} days to their next order</div>`:'';
 tt.innerHTML=`<div class="h">${d.full}</div><div class="r">${d.pct}% of ${ORD[d.col]} orders</div><div class="r">${d.count.toLocaleString()} customers</div>${gap}${cs}`;tt.style.opacity=1;move(e);
}).on('mouseleave',()=>{tt.style.opacity=0;hideAll();});
linkSel.on('mousemove',(e,d)=>{dim(new Set([d]));const pct=(d.value/d.source.count*100).toFixed(1);
 tt.innerHTML=`<div class="h">${d.source.name} → ${d.target.name}</div><div class="r">${d.value.toLocaleString()} customers</div><div class="r">${pct}% of ${d.source.name} buyers</div><div class="r time">⏱ avg ${d.avgDays} days between these orders (median ${d.medDays})</div><div class="r" style="color:#9ca3af">${ORD[d.source.col]} → ${ORD[d.target.col]} order</div>`;tt.style.opacity=1;move(e);
}).on('mouseleave',()=>{tt.style.opacity=0;hideAll();});
